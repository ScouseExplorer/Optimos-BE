name: Security Gate

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  security-and-critical-tests:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: production
      SECRET_KEY: this-is-a-long-safe-secret-key-for-ci-validation-123
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_db
      AUTO_CREATE_TABLES: "false"
      LOG_LEVEL: INFO
      RATE_LIMIT_WINDOW_SECONDS: "60"
      RATE_LIMIT_DEFAULT_REQUESTS: "120"
      RATE_LIMIT_AUTH_REQUESTS: "20"
      RATE_LIMIT_AI_REQUESTS: "40"
      RATE_LIMIT_ADMIN_REQUESTS: "30"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate runtime security configuration
        run: python scripts/validate_runtime_config.py

      - name: Run critical security tests
        run: |
          pytest -q tests/test_runtime_config_validation.py
          pytest -q tests/test_auth_and_isolation.py
          pytest -q tests/test_credits_security.py
          pytest -q tests/test_health_and_errors.py
