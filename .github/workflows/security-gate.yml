name: Security Gate

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  security-and-critical-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: ci_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ci_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/optimos_test
      ENVIRONMENT: production
      SECRET_KEY: this-is-a-long-safe-secret-key-for-ci-validation-123
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_db
      AUTO_CREATE_TABLES: "false"
      LOG_LEVEL: INFO
      RATE_LIMIT_WINDOW_SECONDS: "60"
      RATE_LIMIT_DEFAULT_REQUESTS: "120"
      RATE_LIMIT_AUTH_REQUESTS: "20"
      RATE_LIMIT_AI_REQUESTS: "40"
      RATE_LIMIT_ADMIN_REQUESTS: "30"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate runtime security configuration
        env:
          PYTHONPATH: .
          RESEND_API_KEY: re_ci_placeholder
          EMAIL_FROM: Optimos <noreply@example.com>
          FRONTEND_URL: https://app.example.com
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
          STRIPE_CREDIT_PRICE_ID: price_ci_credit
          STRIPE_PRO_PRICE_ID: price_ci_pro
          STRIPE_ENTERPRISE_PRICE_ID: price_ci_enterprise
          STRIPE_SUCCESS_URL: https://app.example.com/billing/success
          STRIPE_CANCEL_URL: https://app.example.com/billing/cancel
        run: python scripts/validate_runtime_config.py

      # The suite enables dev-only behaviour, so it must not run with ENVIRONMENT=production.
      - name: Run tests
        env:
          ENVIRONMENT: development
        run: pytest -q
